name: TagAlong
options:
  bundleIdPrefix: com.hninetythree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  TagAlong:
    type: application
    platform: iOS
    sources:
      - TagAlong
      - path: GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hninetythree.tagalong
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "TagAlong records video of you singing your part."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "TagAlong records your voice so the quartet can sing together."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "TagAlong saves your finished performances to your photo library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MB97Z2R567
        ENABLE_USER_SCRIPT_SANDBOXING: YES
